name: Dependency Review

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        # Este action analiza los cambios en los manifiestos de dependencias
        # y bloquea PRs que introduzcan dependencias vulnerables o licencias no permitidas.
